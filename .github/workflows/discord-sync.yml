name: Discord Payout Sync

on:
  schedule:
    # Toutes les 15 minutes (quota GitHub Actions friendly).
    # Décalé de WordPress (:03) et du flux statique (:07) pour éviter
    # que les workflows ne se disputent le push sur main.
    - cron: "0,15,30,45 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    environment: API PAYOUT
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install "requests>=2.31.0" "Pillow>=10.0.0"

      - name: Sync payouts to Discord
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          API_KEY: ${{ secrets.API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python sync.py

      - name: Commit state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json
          if git diff --staged --quiet; then
            echo "Aucun changement d'état."
          else
            git commit -m "chore: mise à jour des payouts publiés"
            git pull --rebase origin main
            git push
          fi
