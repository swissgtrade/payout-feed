name: Static Site Payout Feed

on:
  schedule:
    # Décalé de 7 min par rapport à Discord (:00) et WordPress (:03)
    # pour éviter que les 3 workflows ne se disputent le push sur main.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    environment: API PAYOUT
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install "requests>=2.31.0" "Pillow>=10.0.0"

      - name: Export payouts.json
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          API_KEY: ${{ secrets.API_KEY }}
        run: python export_static_feed.py

      - name: Commit feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A -- payouts.json certs
          if git diff --staged --quiet; then
            echo "Aucun changement du flux."
          else
            git commit -m "chore: mise à jour du flux payouts pour le site statique"
            git pull --rebase origin main
            git push
          fi
