name: WordPress Payout Sync

on:
  schedule:
    # Décalé de Discord (:00) et du flux statique (:07) pour éviter
    # que les workflows ne se disputent le push sur main.
    - cron: "3,18,33,48 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Simulation sans écriture WordPress"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    environment: API PAYOUT
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install "requests>=2.31.0" "Pillow>=10.0.0"

      - name: Sync payouts to WordPress
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          API_KEY: ${{ secrets.API_KEY }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          WP_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run || '0' }}
        run: python sync_wordpress.py

      - name: Commit state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git rebase origin/main
          git add state.json
          if git diff --staged --quiet; then
            echo "Aucun changement d'état."
          else
            git commit -m "chore: mise à jour des payouts WordPress publiés"
            git push
          fi
